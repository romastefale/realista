name: Processar
# Dois jeitos de pedir um processamento:
# - pela página: a seta abre uma issue já preenchida ("processar <versão>", com as opções
#   no corpo); você anexa a foto (ou cola o link dela), confirma no GitHub e a issue dispara
#   este workflow. Só issues abertas pelo dono do repositório são atendidas.
# - à mão, em Actions → Processar → Run workflow (com o link da foto).
# O run-name é sempre "processar <versão>", para a página achar a execução dela.
# O upscale é sempre 2x e a saída é sempre PNG (se passar do limite do GitHub, vira JPG). O resultado vai para saida/<versão>.png (ou .jpg) na branch "tmp"; o workflow "Limpar" a esconde depois de ~1h.
run-name: ${{ github.event_name == 'issues' && github.event.issue.title || format('processar {0}', inputs.versao) }}

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      url:
        description: Link da foto
        required: true
        type: string
      versao:
        description: Identificador (letras, números e hífen; 6 a 64)
        required: true
        type: string
      perfil:
        description: dia ou noite
        required: false
        type: string
        default: dia
      pelos:
        description: Intensidade do realce dos pelos (0 a 3)
        required: false
        type: string
        default: "1.0"

permissions:
  contents: write
  issues: write

jobs:
  processar:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.login == github.repository_owner &&
       startsWith(github.event.issue.title, 'processar '))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Ler o pedido
        id: pedido
        env:
          EVENTO: ${{ github.event_name }}
          TITULO: ${{ github.event.issue.title }}
          CORPO: ${{ github.event.issue.body }}
          URL_MANUAL: ${{ inputs.url }}
          VERSAO_MANUAL: ${{ inputs.versao }}
          PERFIL_MANUAL: ${{ inputs.perfil }}
          PELOS_MANUAL: ${{ inputs.pelos }}
        run: python3 scripts/pedido.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Baixar a foto
        id: foto
        env:
          URL: ${{ steps.pedido.outputs.url }}
          VERSAO: ${{ steps.pedido.outputs.versao }}
        run: |
          arquivo=$(python scripts/baixar.py "$URL" trabalho/entrada "$VERSAO")
          echo "arquivo=$arquivo" >> "$GITHUB_OUTPUT"

      - name: Processar
        env:
          ARQUIVO: ${{ steps.foto.outputs.arquivo }}
          PERFIL: ${{ steps.pedido.outputs.perfil }}
          PELOS: ${{ steps.pedido.outputs.pelos }}
        run: |
          mkdir -p trabalho/saida
          python realista.py "$ARQUIVO" -e 2 --max-mp 100 -p "$PERFIL" --pelos "$PELOS" --png -o trabalho/saida
          # o script nomeia a saída sozinho; o job só passa se ela existir
          arq=$(ls trabalho/saida/*.png 2>/dev/null | head -n 1 || true)
          [ -n "$arq" ] || { echo "::error::O realista.py não gerou a imagem (veja o log do passo)."; exit 1; }
          mv "$arq" trabalho/resultado.png

      - name: Ajustar o tamanho
        id: ajuste
        env:
          ORIGINAL: ${{ steps.foto.outputs.arquivo }}
        run: |
          # PNG acima de ~90 MiB não cabe no GitHub (100 MB por arquivo): recomprime sem perda
          # e, se ainda passar, entrega JPG de alta qualidade. A página baixa o que existir.
          final=$(python scripts/ajustar.py trabalho/resultado.png)
          echo "arquivo=$final" >> "$GITHUB_OUTPUT"
          echo "ext=${final##*.}" >> "$GITHUB_OUTPUT"
          # a página lê estes avisos do workflow e mostra para você
          if [ "${final##*.}" != "png" ]; then
            echo "::warning::Aviso: o PNG passou do limite de 100 MB do GitHub e foi entregue em JPG de alta qualidade, com o mesmo tamanho em pixels."
          fi
          python scripts/conferir.py "$ORIGINAL" "$final"

      - name: Gravar o resultado na branch tmp
        env:
          VERSAO: ${{ steps.pedido.outputs.versao }}
          ARQUIVO: ${{ steps.ajuste.outputs.arquivo }}
          EXT: ${{ steps.ajuste.outputs.ext }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if ! git ls-remote --exit-code --heads origin tmp >/dev/null 2>&1; then
            echo "::error::A branch tmp não existe. Rode o workflow Limpar uma vez."
            exit 1
          fi
          for espera in 2 4 8 16; do
            git fetch -q origin +refs/heads/tmp:refs/remotes/origin/tmp
            git checkout -q -B tmp-trabalho origin/tmp
            mkdir -p saida
            cp "$ARQUIVO" "saida/$VERSAO.$EXT"
            git add "saida/$VERSAO.$EXT"
            git commit -q -m "saida: $VERSAO"
            git push -q origin tmp-trabalho:refs/heads/tmp && exit 0
            sleep "$espera"
          done
          echo "::error::Não consegui gravar o resultado."
          exit 1

      - name: Tirar a foto da issue e fechar
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO: ${{ github.event.issue.number }}
          RESULTADO: ${{ job.status }}
          EXECUCAO: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          api="repos/$GITHUB_REPOSITORY/issues/$NUMERO"
          # tira o link da foto do texto; o histórico de edições da issue ainda guarda a versão anterior
          gh api -X PATCH "$api" -f body="Pedido processado. A foto foi retirada do texto desta issue." >/dev/null || true
          if [ "$RESULTADO" = "success" ]; then
            gh api -X POST "$api/comments" -f body="Pronto: $EXECUCAO" >/dev/null || true
            gh api -X PATCH "$api" -f state=closed -f state_reason=completed >/dev/null
          else
            gh api -X POST "$api/comments" -f body="O processamento falhou. Motivo na execução: $EXECUCAO" >/dev/null || true
            gh api -X PATCH "$api" -f state=closed -f state_reason=not_planned >/dev/null
          fi
